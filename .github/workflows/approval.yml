name: PR Approval Policy

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read
  statuses: write

jobs:
  approval-policy:
    name: Check approval policy
    runs-on: ubuntu-latest

    steps:
      - name: Check approval requirement
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADMIN_USERNAME: e6nlaq
        shell: bash
        run: |
          set -euo pipefail

          # PR情報を取得
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          author=$(jq -r '.user.login' <<< "$pr")
          head_sha=$(jq -r '.head.sha' <<< "$pr")

          # 共通のコミットステータスを更新する関数
          set_status() {
            local state="$1"
            local description="$2"

            gh api \
              --method POST \
              "repos/$REPO/statuses/$head_sha" \
              -f state="$state" \
              -f context="PR Approval Policy" \
              -f description="$description"
          }

          echo "PR author: $author"

          # 自分のPRはApprove不要
          if [[ "$author" == "$ADMIN_USERNAME" ]]; then
            set_status "success" "Admin PR: approval not required"
            echo "Admin PR: approval not required."
            exit 0
          fi

          # レビュー履歴を取得
          reviews=$(gh api --paginate \
            "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq '.[]' | jq -s '.')

          # 各レビュアーの最新レビューを確認
          approved=$(jq \
            --arg author "$author" \
            --arg head "$head_sha" '
              sort_by(.submitted_at)
              | group_by(.user.login)
              | map(.[-1])
              | map(select(
                  .user.login != $author
                  and .state == "APPROVED"
                  and .commit_id == $head
                ))
              | length
            ' <<< "$reviews")

          if (( approved >= 1 )); then
            set_status "success" "Approval found on latest commit"
            echo "Approval found."
          else
            set_status "failure" "At least one approval on latest commit is required"
            echo "Approval is required."
          fi
