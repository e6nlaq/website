name: E2E

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Run E2E tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5
        id: mise

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.mise.outputs.bun }}-${{ hashFiles('**/bun.lock') }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      # ワークフローでは CI=true になるため、chromium + firefox + webkit の 3
      # ブラウザで実行される(playwright.config.ts を参照)
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
